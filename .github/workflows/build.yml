name: Deploy to Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.pages-deploy.outputs.page_url }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Apply
        env:
          AD3F70: ${{ secrets.AD3F70 }}
          B0F083: ${{ secrets.B0F083 }}
        run: |
          python3 -c "
          import os, sys, pathlib
          tag_a = os.environ.get('AD3F70', '')
          tag_b = os.environ.get('B0F083', '')
          fpath = pathlib.Path('index.html')
          orig = fpath.read_text(encoding='utf-8')
          updated = orig
          if tag_a:
              updated = updated.replace('<!-- bd3b2d9e9f06b642d3cf50ac33cd18502e5192 -->', tag_a)
          if tag_b:
              updated = updated.replace('<!-- f7fe43bad6a6e4665d19f20ca5e115b76a21ba6da4cc39 -->', tag_b)
          if updated == orig and (tag_a or tag_b):
              sys.exit(1)
          if updated != orig:
              fpath.write_text(updated, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: pages-deploy
        uses: actions/deploy-pages@v4
